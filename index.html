<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Connect Google Calendar</title>
<style>
  body{font:14px/1.4 -apple-system,Segoe UI,Arial,sans-serif;color:#222;background:#fff;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  .wrap{max-width:320px;padding:1rem}
</style>
</head>
<body>
<div class="wrap" id="msg">Connecting to Google…</div>
<script>
// Small https helper page for the Roseberry planner's Google Calendar export. The planner itself
// runs from a file:// URL, which Google refuses to grant OAuth tokens to directly — it only trusts
// registered http(s) origins/redirect URIs. This page runs the whole Google sign-in step on a
// trusted https origin instead (this one), then hands the resulting access token back to whichever
// window opened it, via postMessage.
//
// Deliberately NOT using Google Identity Services' popup-based token client here: that opens a
// *second* popup from within this already-a-popup page, and browsers reliably keep blocking that
// second-level popup for this origin once they've blocked it once — even on a later, genuine click.
// Instead this page just navigates ITSELF (no popup involved at all) to Google's OAuth authorization
// endpoint with response_type=token, and Google redirects back to this same URL with the access
// token in the URL fragment — nothing for a popup blocker to ever object to, since it's just a
// normal page navigation.
//
// Deploy this file at https://tjdscgit.github.io/google-oauth-connect/ and register that exact URL
// as an Authorized redirect URI (not just a JS origin) on the Google Cloud OAuth Client ID used here.
const REDIRECT_URI = "https://tjdscgit.github.io/google-oauth-connect/";
const SCOPE = "https://www.googleapis.com/auth/calendar";

function qs(name){ return new URLSearchParams(location.search).get(name); }
function hashParams(){ return new URLSearchParams(location.hash.slice(1)); }
function setMsg(t){ document.getElementById("msg").textContent = t; }
function finish(payload){
  if(window.opener) window.opener.postMessage(Object.assign({source:"gcal-oauth"}, payload), "*");
  setTimeout(()=>window.close(), 400);
}

const h = hashParams();
if(h.get("access_token")){
  setMsg("Connected — you can close this window.");
  finish({ token: h.get("access_token"), expiresIn: Number(h.get("expires_in")) || 3600 });
}else if(h.get("error")){
  setMsg("Google sign-in failed: " + h.get("error"));
  finish({ error: h.get("error") });
}else{
  const clientId = qs("client_id");
  const silent = qs("silent") === "1";
  if(!clientId){
    setMsg("Missing client_id.");
  }else{
    const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({
      client_id: clientId, redirect_uri: REDIRECT_URI, response_type: "token",
      scope: SCOPE, include_granted_scopes: "true", prompt: silent ? "none" : "select_account consent",
    }).toString();
    location.replace(authUrl);
  }
}
</script>
</body>
</html>
